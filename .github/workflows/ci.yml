name: CI
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tfno,dino,visualization]"
      - name: Validate recipes
        run: phase-validate-configs configs
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q -m "not gpu and not checkpoint"
      - name: Build distributions
        run: python -m build
