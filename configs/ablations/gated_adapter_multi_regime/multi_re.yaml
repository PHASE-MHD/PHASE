####################
## Locked three-channel gated-adapter multi-regime ablation.
## Required environment variables: DATA_ROOT and OUTPUT_ROOT.
## Uses the corrected single-Re transfer-learning checkpoint as a model-only
## warm start; optimizer and epoch state start fresh.

model_params:
  model_type: "poseidon-mhd-re-finetune"
  poseidon_model: "camlab-ethz/Poseidon-T"
  load_pretrained_poseidon: true
  image_size: 128
  patch_size: 4
  out_channels: 3
  poseidon_input_channel_map: [1, 2]
  poseidon_output_channel_map: [1, 2]
  magnetic_channel_index: 4
  use_poseidon_fluid_normalization: true
  magnetic_input_init: "mean_velocity"
  magnetic_output_init: "zero"
  velocity_residual: false
  velocity_residual_scale: 1.0
  magnetic_residual: true
  magnetic_residual_scale: 1.0
  re_conditioning:
    enabled: true
    type: "deep_adapter_output_film"
    hidden_dim: 128
    num_layers: 2
    log_re_mean: 2.9756
    log_re_std: 0.5417
    include_rem: true
    residual_scale: 1.0
    reference_re: 1000.0
    deep_adapter:
      target: "all"
      bottleneck_dim: 64
      hidden_dim: 128
      num_layers: 2
      adapter_scale: 1.0
      gate_type: "channel"

normalization_params:
  type: "physics"
  input_norm: [1.0, 1.0, 0.0052]
  output_norm: [1.0, 1.0, 0.0052]

dataset_params:
  dataset_type: "multi_re"
  data_root: "${DATA_ROOT}"
  data_file: "mhd_data_3channel.npy"
  n: 1000
  re_values: [80, 200, 400, 650, 1000, 1500, 2050, 2750, 3600, 4500]
  rem_values: [80, 200, 400, 650, 1000, 1500, 2050, 2750, 3600, 4500]
  name: "MHD_PoseidonExpanded_MultiRe_GatedAdapter_CorrectedRe1000Warm"
  train_size_per_re: 800
  val_plus_test_size_per_re: 200
  seed: 42
  sub_t: 4
  sub_x: 1
  t_range: [0.0, 1.0]
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]
  balanced_re_batches: true
  res_per_batch: 10

loss_params:
  type: "physics-informed"
  nu: 0.001
  eta: 0.001
  rho0: 1.0
  data_weight: 10.0
  ic_weight: 1.0
  pde_weight: 0.001
  constraint_weight: 0.1
  magnetic_field_weight: 1.0
  use_data_loss: true
  use_ic_loss: true
  use_pde_loss: true
  use_constraint_loss: true
  u_weight: 1.0
  v_weight: 1.0
  A_weight: 5.0
  Du_weight: 1.0
  Dv_weight: 1.0
  DA_weight: 100.0
  div_vel_weight: 1.0
  div_B_weight: 0.0
  Lx: 1.0
  Ly: 1.0
  tend: 1.0
  use_weighted_mean: false

dataloader_params:
  train: {batch_size: 1, num_workers: 1, shuffle: true, pin_memory: true}
  validation: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}
  test: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}

optimizer_params:
  optimizer_type: "adamw"
  lr: 1.0e-5
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  param_groups:
    enabled: true
    pretrained_lr: 1.0e-7
    new_lr: 1.0e-3
    boundary_group: "pretrained"
    freeze_pretrained: false
    pretrained_weight_decay: 1.0e-2
    new_weight_decay: 0.0
  use_scheduler: false
  scheduler_type: "dummy"

train_params:
  recipe: "gated_adapter_multi_re"
  epochs: 100
  checkpoint_path: "${OUTPUT_ROOT}/checkpoints/gated_adapter_multi_re.pt"
  warm_start_checkpoint: "${OUTPUT_ROOT}/checkpoints/scot_with_tl_re1000.pt"
  load_checkpoint: ""
  is_finetune: true
  checkpoint_metric: "normalized_validation_loss"
