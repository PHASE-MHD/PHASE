####################
## Locked Re=Rm=1000 scOT-without-transfer-learning ablation.
## Required environment variables: DATA_ROOT and OUTPUT_ROOT.

model_params:
  model_type: "poseidon-mhd-finetune"
  poseidon_model: null
  load_pretrained_poseidon: false
  image_size: 128
  patch_size: 4
  out_channels: 3
  poseidon_input_channel_map: [1, 2]
  poseidon_output_channel_map: [1, 2]
  magnetic_channel_index: 4
  use_poseidon_fluid_normalization: false
  # Retained for legacy-config parity. These expansion settings are inactive
  # when load_pretrained_poseidon=false; the complete scOT is random-initialized.
  magnetic_input_init: "zero"
  magnetic_output_init: "zero"
  velocity_residual: true
  velocity_residual_scale: 1.0
  magnetic_residual: true
  magnetic_residual_scale: 1.0
  fallback_poseidon_num_channels: 5
  fallback_poseidon_num_out_channels: 5
  fallback_poseidon_embed_dim: 48
  fallback_poseidon_depths: [2, 2, 2, 2]
  fallback_poseidon_num_heads: [3, 6, 12, 24]
  fallback_poseidon_skip_connections: [2, 2, 2, 0]
  window_size: 7
  skip_connections: [2, 2, 2, 0]

normalization_params:
  type: "physics"
  input_norm: [1.0, 1.0, 0.0052]
  output_norm: [1.0, 1.0, 0.0052]

dataset_params:
  data_path: "${DATA_ROOT}/mhd_Re1000_N1000/mhd_data_3channel.npy"
  name: "MHD_PoseidonScOTScratch_Re1000_Physics_NuEta1e3_Corrected"
  train_size: 800
  val_plus_test_size: 200
  seed: 42
  sub_t: 4
  sub_x: 1
  t_range: [0.0, 1.0]
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]

loss_params:
  type: "physics-informed"
  nu: 0.001
  eta: 0.001
  rho0: 1.0

  data_weight: 10.0
  ic_weight: 1.0
  pde_weight: 0.001
  constraint_weight: 0.1
  magnetic_field_weight: 1.0

  use_data_loss: true
  use_ic_loss: true
  use_pde_loss: true
  use_constraint_loss: true

  u_weight: 1.0
  v_weight: 1.0
  A_weight: 5.0

  Du_weight: 1.0
  Dv_weight: 1.0
  DA_weight: 100.0

  div_vel_weight: 1.0
  div_B_weight: 0.0

  Lx: 1.0
  Ly: 1.0
  tend: 1.0
  use_weighted_mean: false

dataloader_params:
  train: {batch_size: 1, num_workers: 1, shuffle: true, pin_memory: true}
  validation: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}
  test: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}

optimizer_params:
  optimizer_type: "adamw"
  lr: 5.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  param_groups:
    enabled: false
  use_scheduler: false
  scheduler_type: "dummy"

train_params:
  epochs: 100
  checkpoint_path: "${OUTPUT_ROOT}/checkpoints/scot_without_tl_re1000.pt"
  load_checkpoint: ""
  is_finetune: false
  checkpoint_metric: normalized_validation_loss
