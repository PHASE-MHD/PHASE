####################
## End-to-end KH acceptance: 20% of canonical Re=Rm=1000 data, 10 epochs.
## Required environment variables: DATA_ROOT and OUTPUT_ROOT.

model_params:
  model_type: "poseidon-mhd-finetune"
  poseidon_model: "camlab-ethz/Poseidon-T"
  load_pretrained_poseidon: true
  image_size: 128
  patch_size: 4
  out_channels: 4
  poseidon_input_channel_map: [1, 2]
  poseidon_output_channel_map: [1, 2]
  magnetic_channel_indices: [4, 5]
  fallback_poseidon_num_channels: 6
  fallback_poseidon_num_out_channels: 6
  use_poseidon_fluid_normalization: true
  magnetic_input_init: "mean_velocity"
  magnetic_output_init: "mean_velocity"
  velocity_residual: false
  magnetic_residual: true
  magnetic_residual_scale: 1.0
  helmholtz_projection: true
  project_velocity: true
  project_magnetic: true
  helmholtz_domain_size_x: 1.0
  helmholtz_domain_size_y: 1.0

normalization_params:
  type: "physics"
  input_norm: [1.0, 1.0, 6.69424514e-02, 6.69424514e-02]
  output_norm: [1.0, 1.0, 6.69424514e-02, 6.69424514e-02]
  paired_input_groups: [[0, 1], [2, 3]]
  paired_output_groups: [[0, 1], [2, 3]]
  paired_mode: "rms"

dataset_params:
  dataset_type: "single_re"
  data_path: "${DATA_ROOT}/mhd_Re1000_N1000/mhd_data_4channel.npy"
  train_size: 800
  val_plus_test_size: 200
  train_sample_fraction: 0.2
  validation_sample_fraction: 0.1
  test_sample_fraction: 0.1
  seed: 42
  sub_t: 5
  sub_x: 1
  t_range: [0.0, 5.0]
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]

loss_params:
  type: "physics-informed-bfield"
  nu: 0.001
  eta: 0.001
  rho0: 1.0
  data_weight: 10.0
  ic_weight: 1.0
  pde_weight: 0.001
  constraint_weight: 0.0
  vorticity_weight: 2.0
  current_weight: 5.0
  use_data_loss: true
  use_ic_loss: true
  use_pde_loss: true
  use_constraint_loss: true
  u_weight: 1.0
  v_weight: 1.0
  Bx_weight: 5.0
  By_weight: 5.0
  u_time_loss_mode: "time_relative"
  u_time_loss_eps: 1.0e-6
  v_time_loss_mode: "time_relative"
  v_time_loss_eps: 1.0e-6
  magnetic_time_loss_mode: "time_relative"
  magnetic_time_loss_eps: 1.0e-6
  derived_time_loss_mode: "time_relative"
  derived_time_loss_eps: 1.0e-6
  Du_weight: 1.0
  Dv_weight: 1.0
  DBx_weight: 100.0
  DBy_weight: 100.0
  div_vel_weight: 0.0
  div_B_weight: 0.0
  Lx: 1.0
  Ly: 1.0
  tend: 5.0
  use_weighted_mean: false

dataloader_params:
  train: {batch_size: 1, num_workers: 4, shuffle: true, pin_memory: true}
  validation: {batch_size: 1, num_workers: 4, shuffle: false, pin_memory: false}
  test: {batch_size: 1, num_workers: 4, shuffle: false, pin_memory: false}

optimizer_params:
  optimizer_type: "adamw"
  lr: 1.0e-5
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  param_groups:
    enabled: true
    pretrained_lr: 5.0e-6
    new_lr: 5.0e-4
    magnetic_output_lr: 2.0e-3
    pretrained_weight_decay: 1.0e-2
    new_weight_decay: 0.0
  use_scheduler: false
  scheduler_type: "dummy"

train_params:
  recipe: "kh_four_channel_single_re"
  epochs: 10
  acceptance_run: true
  validation_interval: 5
  checkpoint_path: "${OUTPUT_ROOT}/checkpoints/kh_20pct_10ep/single_re_scot_re1000.pt"
  warm_start_checkpoint: ""
  load_checkpoint: ""
  is_finetune: true
  checkpoint_metric: "normalized_validation_loss"
