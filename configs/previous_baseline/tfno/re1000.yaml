# Previous-study tFNO baseline used by the PHASE ablation table.
# Required environment variables: DATA_ROOT, STATS_ROOT, OUTPUT_ROOT.
model_params:
  model_type: tfno
  model_variant: 3d
  in_channels: 6
  out_channels: 3
  decoder_layers: 1
  dimension: 3
  latent_channels: 32
  num_fno_layers: 8
  num_fno_modes: 8
  padding: [5, 0, 0]
  padding_type: constant
  activation_fn: gelu
  coord_features: false
  rank: 0.5
  factorization: cp

normalization_params:
  type: minmax
  stats_file: ${STATS_ROOT}/train_only_stats_Re1000.npz
  feature_range: [-1, 1]

dataset_params:
  data_path: ${DATA_ROOT}/mhd_Re1000_N1000/mhd_data_3channel.npy
  channels: [ux, uy, A]
  train_size: 900
  val_plus_test_size: 100
  seed: 42
  sub_t: 4
  sub_x: 1
  t_range: [0.0, 1.0]
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]

dataloader_params:
  train: {batch_size: 1, num_workers: 1, shuffle: true, pin_memory: true}
  validation: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}
  test: {batch_size: 1, num_workers: 1, shuffle: false, pin_memory: false}

loss_params:
  type: physics-informed
  nu: 0.001
  eta: 0.001
  rho0: 1.0
  data_weight: 5.0
  ic_weight: 1.0
  pde_weight: 1.0
  constraint_weight: 10.0
  use_data_loss: true
  use_ic_loss: true
  use_pde_loss: true
  use_constraint_loss: true
  u_weight: 1.0
  v_weight: 1.0
  A_weight: 1.0
  Du_weight: 1.0
  Dv_weight: 1.0
  DA_weight: 1000000
  div_B_weight: 1.0
  div_vel_weight: 1.0
  Lx: 1.0
  Ly: 1.0
  tend: 1.0
  use_weighted_mean: false

optimizer_params:
  optimizer_type: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  use_scheduler: true
  scheduler_type: reducelr
  mode: min
  factor: 0.7
  patience: 5

train_params:
  recipe: previous_tfno
  epochs: 100
  checkpoint_path: ${OUTPUT_ROOT}/checkpoints/tfno_re1000.pt
  load_checkpoint: ""
  validation_interval: 1
  checkpoint_metric: model_val_loss
  clip_grad: true
  clip_grad_max_norm: 1.0
