[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase"
version = "0.1.0"
description = "PHASE"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.8,<4",
  "numpy>=1.24,<3",
  "torch>=2.1,<3",
  "PyYAML>=6,<7",
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest"]
tfno = [
  "tensorly-torch==0.5.0",
]
dino = [
  "einops>=0.7,<1",
  "packaging>=23,<26",
  "tensorly-torch==0.5.0",
  "tqdm>=4.66,<5",
]
scot = [
  "accelerate==0.31.0",
  "transformers==4.29.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "checkpoint: requires an external model checkpoint",
  "integration: exercises multiple PHASE components",
]
