[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase"
version = "0.1.0"
description = "PHASE"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.1,<3",
  "PyYAML>=6,<7",
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "checkpoint: requires an external model checkpoint",
  "integration: exercises multiple PHASE components",
]
